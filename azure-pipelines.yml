# Branch triggers:
#   dev     — Check + Docs (PlantUML)
#   staging — Check + Build (Tauri compile validation)
#   v* tags — Check + Build + Release (downloadable binaries; tags are pushed from main)
# PR gating is handled by GitHub Actions CI (faster, no redundant build queue).
trigger:
  branches:
    include:
      - dev
      - staging
  tags:
    include:
      - 'v*'

pr: none

variables:
  NODE_VERSION: '20.x'
  CARGO_HOME: $(Pipeline.Workspace)/.cargo
  npm_config_cache: $(Pipeline.Workspace)/.npm

stages:

# Runs on every push and PR. Two parallel jobs — frontend and Rust — so
# a TypeScript error and a Rust error both surface in the same run.
- stage: Check
  displayName: Check
  jobs:

  - job: Frontend
    displayName: 'TypeScript + Vite build'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Use Node $(NODE_VERSION)'
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    - script: npm ci
      displayName: 'npm ci'
    - script: npm run build
      displayName: 'tsc + vite build'

  - job: RustCheck
    displayName: 'cargo check + clippy'
    pool:
      vmImage: ubuntu-22.04
    steps:
    - task: Cache@2
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_HOME)
      displayName: 'Cache cargo registry'
    - task: Cache@2
      inputs:
        key: 'cargo-target-check | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-target-check | "$(Agent.OS)"
        path: src-tauri/target
      displayName: 'Cache cargo target'
    - script: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
      displayName: 'Install Tauri v2 Linux deps'
    - script: |
        rustup update stable
        rustup default stable
      displayName: 'Update Rust to stable'
    - script: cargo check --manifest-path src-tauri/Cargo.toml
      displayName: 'cargo check'
    - script: cargo clippy --manifest-path src-tauri/Cargo.toml
      displayName: 'cargo clippy'


# Renders PlantUML diagrams to SVG and publishes them as a pipeline artifact
- stage: Docs
  displayName: Docs
  dependsOn: Check
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - job: RenderDiagrams
    displayName: 'Render PlantUML -> SVG'
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        curl -L -o plantuml.jar \
          https://github.com/plantuml/plantuml/releases/download/v1.2024.8/plantuml-1.2024.8.jar
        java -jar plantuml.jar docs/diagrams/models.puml -tsvg \
          -o "$(Build.ArtifactStagingDirectory)/diagrams"
      displayName: 'Render models.puml'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/diagrams'
        artifact: diagrams
      displayName: 'Publish SVG artifact'

- stage: Build
  displayName: 'Tauri build'
  dependsOn: Check
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/staging'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
  jobs:

  - job: Windows
    displayName: 'Windows (.msi / .exe)'
    pool:
      vmImage: windows-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Use Node $(NODE_VERSION)'
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    - task: Cache@2
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_HOME)
      displayName: 'Cache cargo registry'
    - task: Cache@2
      inputs:
        key: 'cargo-target-build | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-target-build | "$(Agent.OS)"
        path: src-tauri/target
      displayName: 'Cache cargo target'
    - script: npm ci
      displayName: 'npm ci'
    - script: rustup update stable && rustup default stable
      displayName: 'Update Rust to stable'
    - script: npx tauri build
      displayName: 'tauri build'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'src-tauri/target/release/bundle'
        artifact: tauri-windows
      displayName: 'Publish Windows artifacts'

  - job: macOS
    displayName: 'macOS (.dmg / .app)'
    pool:
      vmImage: macos-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Use Node $(NODE_VERSION)'
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    - task: Cache@2
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_HOME)
      displayName: 'Cache cargo registry'
    - task: Cache@2
      inputs:
        key: 'cargo-target-build | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-target-build | "$(Agent.OS)"
        path: src-tauri/target
      displayName: 'Cache cargo target'
    - script: npm ci
      displayName: 'npm ci'
    - script: |
        rustup update stable
        rustup default stable
      displayName: 'Update Rust to stable'
    - script: npx tauri build
      displayName: 'tauri build'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'src-tauri/target/release/bundle'
        artifact: tauri-macos
      displayName: 'Publish macOS artifacts'

  - job: Linux
    displayName: 'Linux (.AppImage / .deb)'
    pool:
      vmImage: ubuntu-22.04
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Use Node $(NODE_VERSION)'
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    - task: Cache@2
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_HOME)
      displayName: 'Cache cargo registry'
    - task: Cache@2
      inputs:
        key: 'cargo-target-build | "$(Agent.OS)" | src-tauri/Cargo.lock'
        restoreKeys: |
          cargo-target-build | "$(Agent.OS)"
        path: src-tauri/target
      displayName: 'Cache cargo target'
    - script: npm ci
      displayName: 'npm ci'
    - script: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
      displayName: 'Install Tauri v2 Linux deps'
    - script: |
        rustup update stable
        rustup default stable
      displayName: 'Update Rust to stable'
    - script: npx tauri build
      displayName: 'tauri build'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'src-tauri/target/release/bundle'
        artifact: tauri-linux
      displayName: 'Publish Linux artifacts'

- stage: Release
  displayName: 'GitHub Release'
  dependsOn: Build
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
  jobs:
  - job: PublishRelease
    displayName: 'Publish installers to GitHub Releases'
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: tauri-windows
    - download: current
      artifact: tauri-macos
    - download: current
      artifact: tauri-linux

    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'mchaney-dev'
        repositoryName: '$(Build.Repository.Name)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(Build.SourceBranchName)'
        title: 'Explorer $(Build.SourceBranchName)'
        releaseNotesSource: 'inline'
        releaseNotesInline: 'Automated release for $(Build.SourceBranchName). Installers for Windows, macOS, and Linux are attached below.'
        assets: |
          $(Pipeline.Workspace)/tauri-windows/**/*.msi
          $(Pipeline.Workspace)/tauri-windows/**/*.exe
          $(Pipeline.Workspace)/tauri-macos/**/*.dmg
          $(Pipeline.Workspace)/tauri-linux/**/*.AppImage
          $(Pipeline.Workspace)/tauri-linux/**/*.deb
        addChangeLog: true
        isDraft: false
        isPreRelease: true
